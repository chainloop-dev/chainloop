name: Sync Chainloop Workflow contracts
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/contracts/**"
  schedule:
    - cron: "0 0 * * *" # daily at midnight

# Declare default permissions as read only.
permissions: read-all

jobs:
  chainloop_contract_sync:
    name: "Chainloop Contract Sync"
    runs-on: ubuntu-latest
    env:
      CHAINLOOP_TOKEN: ${{ secrets.CHAINLOOP_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install Chainloop
        # The installer is pinned by digest, as in package_sandbox_kit.yaml.
        # If dl.chainloop.dev publishes a new installer, re-pin with:
        #   curl -sfL https://dl.chainloop.dev/cli/install.sh | sha256sum
        env:
          INSTALLER_SHA256: 6ebcdb8edc6f22c92b6ac31a363f7d60da6e04c60c4fadda44169f18492ba46e
        run: |
          curl -sfL https://dl.chainloop.dev/cli/install.sh -o /tmp/chainloop-install.sh
          echo "${INSTALLER_SHA256}  /tmp/chainloop-install.sh" | sha256sum -c -
          bash /tmp/chainloop-install.sh
      - name: Update contract definitions
        run: |
          for file in .github/workflows/contracts/*.yaml; do
            chainloop wf contract apply -f $file
          done
