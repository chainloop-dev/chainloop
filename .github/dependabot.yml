# Dependabot configuration for version updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # Go modules. The root go.mod is a single module covering the control plane,
  # CLI, artifact CAS, and the shared pkg/ libraries.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Wait 7 days after a version is published before proposing it. This limits
    # exposure to freshly released (and potentially compromised) versions.
    cooldown:
      default-days: 7
    # Bundle minor and patch bumps into a single PR to cut noise; majors stay
    # as individual PRs so they get reviewed on their own.
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"

  # Docker base images. Dependabot scans each listed directory for Dockerfiles
  # (non-recursive), so every directory with a Dockerfile needs an entry.
  # Today this tracks the Atlas image in app/controlplane/Dockerfile.migrations.
  # When it bumps Atlas, also bump ATLAS_VERSION in common.mk and
  # .github/workflows/test.yml in the same PR.
  - package-ecosystem: "docker"
    directories:
      - "/app/controlplane"
      - "/app/cli"
      - "/app/artifact-cas"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # Go version bumps are coordinated with go.mod through the upgrading-golang
    # skill (.claude/skills/upgrading-golang). Dependabot bumps the image tag
    # only and would drift it away from go.mod.
    ignore:
      - dependency-name: "golang"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
