{{- /*
gRPC routes of the shared CAS endpoint (spec D-018). Rendered as a second
Ingress on the same hostname as cas/ingress.yaml, with its own annotations:
controllers that set the backend protocol per Ingress resource (community
nginx `backend-protocol`) need a dedicated object for the gRPC paths, so the
gRPC routes use HTTP/2 (grpc_pass) while HTTP routes keep HTTP/1.1.
ingress-nginx additionally dials the ClusterIP for gRPC and pod endpoints
for HTTP, using distinct Service port names as backend identities. Its global
keepalive pool cannot reuse a socket across protocols. Controllers that conflict on unrelated
same-host Ingress objects (F5 NGINX) need their own resource instead; see
the chart README.
*/}}
{{- if and .Values.cas.ingress.enabled .Values.cas.ingress.grpc.paths }}
{{- $fullName := include "chainloop.cas.fullname" . -}}
{{- $grpcName := printf "%s-grpc" $fullName -}}
{{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.cas.ingress.grpc.annotations .Values.commonAnnotations .Values.cas.ingress.grpc.defaultAnnotations) "context" .) | fromYaml -}}
{{- if eq (toString .Values.cas.service.ports.grpcShared) (toString (coalesce .Values.cas.service.port .Values.cas.service.ports.http)) -}}
  {{- fail "cas.service.ports.grpcShared must differ from the HTTP Service port to isolate ingress upstream connections" -}}
{{- end -}}
{{- $httpAnnotations := include "common.tplvalues.merge" (dict "values" (list .Values.cas.ingress.annotations .Values.commonAnnotations) "context" .) | fromYaml -}}
{{- if has (upper (default "" (index $annotations "nginx.ingress.kubernetes.io/backend-protocol"))) (list "GRPC" "GRPCS") -}}
  {{- if and (ne (default "false" (index $annotations "nginx.ingress.kubernetes.io/service-upstream")) "true") (ne (default "false" (index $httpAnnotations "nginx.ingress.kubernetes.io/service-upstream")) "true") -}}
    {{- fail "CAS cmux requires separate ingress-nginx upstream addresses: set service-upstream=true on cas.ingress.grpc (the default) or cas.ingress" -}}
  {{- end -}}
  {{- if eq .Values.cas.service.clusterIP "None" -}}
    {{- fail "CAS cmux ingress-nginx routing requires a ClusterIP Service; cas.service.clusterIP cannot be None" -}}
  {{- end -}}
  {{- if has (upper (default "HTTP" (index $httpAnnotations "nginx.ingress.kubernetes.io/backend-protocol"))) (list "GRPC" "GRPCS") -}}
    {{- fail "cas.ingress must use an HTTP/1.1 upstream (HTTP or HTTPS); set the gRPC protocol only in cas.ingress.grpc.annotations" -}}
  {{- end -}}
{{- end -}}
{{- /* Only one Ingress requests the shared certificate. If the HTTP Ingress
       requests it, the gRPC Ingress only references its Secret. */ -}}
{{- if include "common.ingress.certManagerRequest" (dict "annotations" $httpAnnotations) -}}
  {{- range $key, $_ := deepCopy $annotations -}}
    {{- if or (hasPrefix "cert-manager.io/" $key) (hasPrefix "acme.cert-manager.io/" $key) (eq $key "kubernetes.io/tls-acme") -}}
      {{- $_ := unset $annotations $key -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
apiVersion: {{ include "common.capabilities.ingress.apiVersion" . }}
kind: Ingress
metadata:
  name: {{ $grpcName }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "chainloop.cas.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.cas.ingress.ingressClassName (eq "true" (include "common.ingress.supportsIngressClassname" .)) }}
  ingressClassName: {{ .Values.cas.ingress.ingressClassName | quote }}
  {{- end }}
  rules:
    {{- if .Values.cas.ingress.hostname }}
    - host: {{ .Values.cas.ingress.hostname }}
      http:
        paths:
          {{- range .Values.cas.ingress.grpc.paths }}
          - path: {{ . }}
            {{- if eq "true" (include "common.ingress.supportsPathType" $) }}
            pathType: {{ default "ImplementationSpecific" $.Values.cas.ingress.pathType }}
            {{- end }}
            backend: {{- include "common.ingress.backend" (dict "serviceName" $fullName "servicePort" "grpc-shared" "context" $) | nindent 14 }}
          {{- end }}
    {{- end }}
  {{- if or .Values.cas.ingress.tls .Values.cas.ingress.extraTls }}
  tls:
    {{- if .Values.cas.ingress.tls }}
    - hosts:
        - {{ .Values.cas.ingress.hostname | quote }}
      secretName: {{ printf "%s-tls" .Values.cas.ingress.hostname }}
    {{- end }}
    {{- if .Values.cas.ingress.extraTls }}
    {{- include "common.tplvalues.render" (dict "value" .Values.cas.ingress.extraTls "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}