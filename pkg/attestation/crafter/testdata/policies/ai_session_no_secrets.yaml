apiVersion: chainloop.dev/v1
kind: Policy
metadata:
  name: ai-session-no-secrets
  description: Reports the credentials it can see in an AI coding session
spec:
  policies:
    - kind: CHAINLOOP_AI_CODING_SESSION
      embedded: |
        package main

        import rego.v1

        # Deliberately looks for the raw credential, not the placeholder: this
        # policy exists to prove what the engine is handed. If redaction has done
        # its job upstream, this rule can never fire.
        violations contains msg if {
            regex.match(`ghp_[A-Za-z0-9]{36}`, json.marshal(input))
            msg := "GitHub token reached the policy engine"
        }

        violations contains msg if {
            regex.match(`\[REDACTED(:[^\]\s]*)?\]`, json.marshal(input))
            msg := "secrets were found and redacted in the coding session"
        }
