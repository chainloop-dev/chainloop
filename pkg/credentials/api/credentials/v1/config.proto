syntax = "proto3";
package credentials.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/chainloop-dev/chainloop/pkg/credentials/api/credentials/v1;v1";

// Where the credentials to access the backends are stored
message Credentials {
  oneof backend {
    option (buf.validate.oneof).required = true;

    AWSSecretManager aws_secret_manager = 1;
    Vault vault = 2;
    GCPSecretManager gcp_secret_manager = 3;
    AzureKeyVault azure_key_vault = 5;
  }

  // prefix used while writing a new secret
  string secret_prefix = 4;

  // Top level is deprecated now
  message AWSSecretManager {
    // Required for AUTH_TYPE_CREDENTIALS, rejected for AUTH_TYPE_AMBIENT.
    Creds creds = 1;
    string region = 2 [(buf.validate.field).string.min_len = 1];

    enum AuthType {
      AUTH_TYPE_UNSPECIFIED = 0;
      // Use the static keys in creds.
      AUTH_TYPE_CREDENTIALS = 1;
      // Use the AWS SDK default credential chain (EKS Pod Identity, IRSA, instance role).
      AUTH_TYPE_AMBIENT = 2;
    }

    // How to authenticate. AUTH_TYPE_UNSPECIFIED is treated as AUTH_TYPE_CREDENTIALS.
    AuthType auth_type = 3 [(buf.validate.field).enum.defined_only = true];

    message Creds {
      string access_key = 1 [(buf.validate.field).string.min_len = 1];
      string secret_key = 2 [(buf.validate.field).string.min_len = 1];
    }
  }

  message Vault {
    // TODO: Use application role auth instead
    string token = 1 [(buf.validate.field).string.min_len = 1];
    // Instance address, including port
    // i.e "http://127.0.0.1:8200"
    string address = 2 [(buf.validate.field).string.min_len = 1];
    // mount path of the kv engine, default /secret
    string mount_path = 3;
  }

  message GCPSecretManager {
    // project number
    string project_id = 1 [(buf.validate.field).string.min_len = 1];
    // path to service account key in json format
    string service_account_key = 2;
  }

  message AzureKeyVault {
    // Active Directory Tenant ID
    string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
    // Registered application / service principal client ID
    string client_id = 2 [(buf.validate.field).string.min_len = 1];
    // Registered application / service principal client secret
    string client_secret = 3 [(buf.validate.field).string.min_len = 1];
    // Azure Key Vault URL
    string vault_uri = 4 [(buf.validate.field).string.uri_ref = true];
  }
}
