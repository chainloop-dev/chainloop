# syntax=docker/sandbox-kit:3
# Claude Code in a Docker Sandbox, traced with Chainloop: a mixin on Docker's
# built-in `claude` agent.
#
# GUIDE: https://docs.chainloop.dev/guides/docker-sandboxes
#
# Quick start - the repository must already be initialized for tracing, and the
# kit refuses to create the sandbox if it is not:
#
#   chainloop trace init                     # once per repo, commit the result
#   sbx secret set chainloop                 # once: an org-scoped API token
#   sbx run --clone claude --kit chainloop/sbx-kit-claude:latest .
#
# Work as usual inside the sandbox; the session is attested when you `git push`
# from it. No push, no attestation - push before the sandbox is reclaimed.
#
# Published on every release to docker.io/chainloop/sbx-kit-claude by
# .github/workflows/package_sandbox_kit.yaml. To run the in-repo copy instead:
#   sbx run --clone claude --kit ./devel/sandbox-kit/sbx-kit-claude .
# See devel/sandbox-kit/README.md for the sharp edges.
schemaVersion: "3"
kind: mixin
# The Chainloop release this kit belongs to, as plain semver (no leading `v`).
# Bumped automatically on release by
# .github/workflows/utils/bump-chart-and-dagger-version.sh - do not edit by hand.
# NOTE the install step below is not pinned to it.
version: 1.138.0
displayName: Claude Code (Chainloop-traced)
description: >-
  Claude Code traced with Chainloop. Requires a repository already initialized
  for `chainloop trace`: identity comes from its committed .chainloop.yml and the
  attestation is pushed on `git push`.
sourceUrl: https://github.com/chainloop-dev/chainloop
licenses: [Apache-2.0]
requires: ["claude"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - dl.chainloop.dev:443                                # CLI installer
          - chainloop-baafegchfnekdcde.z02.azurefd.net:443      # CLI download CDN
      runtime:
        allow:
          - cp.chainloop.dev:443          # control plane
          - cas.chainloop.dev:443         # CAS, when the org backend is external
          - api.cp.chainloop.dev:443      # legacy control plane endpoint, for older configs
          - api.cas.chainloop.dev:443     # legacy CAS endpoint, for older configs
          - api.app.chainloop.dev:443     # platform backend
          - t.chainloop.dev:443           # CLI telemetry
          - crb.chainloop.dev:443         # CLI telemetry, older binaries
          - timestamp.digicert.com:80     # RFC 3161 timestamp authority, used when signing
          - buf.build:443                 # Buf Schema Registry, for `make api`
          - github.com:443                # git push - the attestation egresses here.
                                          # Other forges: add your own host.

  # The token stays on the host (`sbx secret set chainloop`); the sandbox sees a
  # placeholder and the egress proxy adds the real value. Not on the CAS: it uses
  # a short-lived token from the control plane, which an injected one would
  # overwrite. Optional, so a self-hosted control plane can use its own secret.
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: chainloop
      phase: runtime
      apiKey:
        name: CHAINLOOP_TOKEN
        proxyManaged: true
        inject:
          - {domain: cp.chainloop.dev, header: Authorization, format: "Bearer %s"}
          - {domain: api.app.chainloop.dev, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # The git hooks invoke `chainloop` by bare name, so it has to be on PATH.
        # HOME=/root keeps install.sh's default config.toml out of the agent's home.
        - command: >-
            mkdir -p /usr/local/bin &&
            curl -sfL https://dl.chainloop.dev/cli/install.sh | HOME=/root bash -s -- --path /usr/local/bin
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY, http_proxy, https_proxy, no_proxy]
          description: Install the chainloop CLI on PATH

        # Anything that would hand back an untraced agent is fatal: a sandbox that
        # quietly records nothing is worse than one that refuses to start. An
        # install hook is the only place that can refuse: a failing one aborts
        # `sbx create`, while a startup hook could only warn.
        - command: |
            set -eu
            die() { echo "[chainloop-trace] ERROR: $1" >&2; exit 1; }

            command -v chainloop >/dev/null 2>&1 \
              || die "chainloop CLI not on PATH - the kit's install step did not complete (check egress to dl.chainloop.dev). Refusing to start an untraced agent."

            # SBX_CRED_CHAINLOOP_MODE is `apikey` when a `chainloop` secret is
            # stored; CHAINLOOP_TOKEN is always a placeholder, unless the user
            # passed their own with -e (self-hosted).
            if [ "${SBX_CRED_CHAINLOOP_MODE:-none}" = none ]; then
              own_token="${CHAINLOOP_TOKEN:-}"
              [ "$own_token" = proxy-managed ] && own_token=""
              [ -n "$own_token" ] || die "no Chainloop credentials. Store an org-scoped API token on the host:
              sbx secret set chainloop"
              # sbx drops a token the sandbox sends itself to the inject hosts
              # when no secret is stored, so it cannot reach Chainloop cloud.
              case "${CHAINLOOP_CONTROL_PLANE_API:-cp.chainloop.dev:443}" in
                cp.chainloop.dev|cp.chainloop.dev:*)
                  die "a CHAINLOOP_TOKEN passed to the sandbox cannot authenticate to Chainloop cloud. Store it on the host instead:
              sbx secret set chainloop" ;;
              esac
            fi

            # Persistent tracing only: the repo must already be initialized, and
            # the identity comes from its committed .chainloop.yml.
            repo_root=$(git -C "${WORKSPACE_DIR:-$PWD}" rev-parse --show-toplevel 2>/dev/null || echo "${WORKSPACE_DIR:-$PWD}")
            # The two filenames the CLI reads, spelled out: a glob here would also
            # accept files Chainloop never looks at, letting the sandbox start untraced.
            if ! { grep -qsE '^[[:space:]]*projectName:[[:space:]]*["'"'"']?[A-Za-z0-9]' "$repo_root/.chainloop.yml" \
                   || grep -qsE '^[[:space:]]*projectName:[[:space:]]*["'"'"']?[A-Za-z0-9]' "$repo_root/.chainloop.yaml"; } \
               || ! grep -qs "chainloop trace hook" "$repo_root/.claude/settings.json"; then
              die "this repository is not initialized for chainloop trace.

              Run this in the repository first, then create the sandbox again:

                chainloop trace init

              It writes .chainloop.yml (organization + projectName) and the
              'chainloop trace hook' entries in .claude/settings.json, which this kit
              reads to know what to attest and when. Both must be committed - the
              sandbox works on a clone, so uncommitted config does not reach it.

              Refusing to start rather than run a session that records nothing."
            fi

            echo "[chainloop-trace] Repo initialized for chainloop trace - persistent mode" >&2
            echo "[chainloop-trace]   identity from .chainloop.yml; attestation is pushed on 'git push'" >&2
          user: "1000"
          env: [SBX_CRED_CHAINLOOP_MODE, CHAINLOOP_TOKEN, CHAINLOOP_CONTROL_PLANE_API, WORKSPACE_DIR]
          description: Refuse to create an untraced sandbox

  - type: com.docker.sandbox/agent-context@2
    optional: true
    config:
      delivery: inline
      content: |
        ## Chainloop tracing
        This session is recorded by Chainloop trace. Tool/MCP usage and coding
        activity are attested and sent to Chainloop (as a CHAINLOOP_AI_CODING_SESSION
        attestation) when you `git push` from this sandbox. No push, no record -
        so push before the sandbox is reclaimed.
