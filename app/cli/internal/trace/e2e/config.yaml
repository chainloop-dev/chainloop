# Configuration of the Chainloop Trace end-to-end suite (spec issue-3635).
#
# Each harness entry pins one version for its column of the feature table
# (D-013) and lists the models that the suite runs it with (D-009). A
# maintainer bumps a pin on purpose. The key is the column name in the
# feature table of ../README.md.
harnesses:
  Claude Code:
    version: "2.1.301"
    models:
      - haiku
  # The Cursor CLI (cursor-agent) runs with a HOME folder next to the
  # workspace, so it has no stored login: it needs CURSOR_API_KEY. The version
  # is a build tag, not a semantic version.
  # A free Cursor plan runs only auto. In auto mode no output names the
  # model, so the model detection check is not covered.
  Cursor:
    version: "2026.10.19-6bbf2c4"
    models:
      - auto
  # The OpenRouter models need OPENROUTER_API_KEY in the environment.
  OpenCode 2:
    version: "2.0.22"
    models:
      - openrouter/anthropic/claude-haiku-5.5
  # Pi runs with an OpenRouter model and needs OPENROUTER_API_KEY.
  Pi:
    version: "1.3.0"
    models:
      - openrouter/anthropic/claude-haiku-5.5
  # A model with the openrouter/ prefix runs on OpenRouter. Any other model
  # runs on the default Codex provider and needs CODEX_API_KEY.
  Codex:
    version: "0.163.0"
    models:
      - openrouter/openai/gpt-6-luna

# Runs and pass threshold of a cell whose feature depends on the model
# following an instruction (R-006, D-004). A cell of any other feature runs
# once.
modelDriven:
  runs: 3
  threshold: 2

# Per-feature overrides of the runs and the threshold, keyed by feature name.
features: {}

# Time limit of one scenario session.
scenarioTimeout: 5m

# Scenario sessions that run at the same time.
parallel: 4
