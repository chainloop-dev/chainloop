syntax = "proto3";

package controlplane.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/chainloop-dev/chainloop/app/controlplane/api/controlplane/v1;v1";

service AuthService {
  rpc DeleteAccount(AuthServiceDeleteAccountRequest) returns (AuthServiceDeleteAccountResponse);
  // ExchangeHandoff trades the single-use handoff code that a login delivered to the client
  // callback for the user session token. It does not require an existing session.
  rpc ExchangeHandoff(AuthServiceExchangeHandoffRequest) returns (AuthServiceExchangeHandoffResponse);
}

// AuthServiceDeleteAccountResponse is the response for the DeleteAccount method.
message AuthServiceDeleteAccountRequest {}

// AuthServiceDeleteAccountResponse is the response for the DeleteAccount method.
message AuthServiceDeleteAccountResponse {}

message AuthServiceExchangeHandoffRequest {
  // The handoff code received in the callback URL
  string handoff = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // The PKCE verifier whose S256 challenge was sent when the login started
  string code_verifier = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  // The callback URL the login was started with
  string callback = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
}

message AuthServiceExchangeHandoffResponse {
  // User session token
  string token = 1;
}
