syntax = "proto3";

package controlplane.v1;

import "buf/validate/validate.proto";
import "controlplane/v1/pagination.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/chainloop-dev/chainloop/app/controlplane/api/controlplane/v1;v1";

service ReferrerService {
  // DiscoverPrivate returns the referrer item for a given digest in the organizations of the logged-in user
  rpc DiscoverPrivate(ReferrerServiceDiscoverPrivateRequest) returns (ReferrerServiceDiscoverPrivateResponse) {
    option (google.api.http) = {get: "/discover/{digest}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Discover private referrer"
      description: "Returns the referrer item for a given digest in the organizations of the logged-in user"
      produces: ["application/json"]
    };
  }
  // DiscoverEdges returns the connections between a set of referrers the caller already holds
  rpc DiscoverEdges(ReferrerServiceDiscoverEdgesRequest) returns (ReferrerServiceDiscoverEdgesResponse) {
    option (google.api.http) = {
      post: "/discover/edges"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Discover the edges between known referrers"
      description: "Returns every connection between the given referrers that is visible to the logged-in user, as pairs of indexes into the request. Referrers the user cannot see contribute no edges."
      produces: ["application/json"]
    };
  }
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    name: "ReferrerService"
    description: "Referrer service for discovering referred content by digest"
  };
}

// ReferrerServiceDiscoverEdgesRequest is the request for the DiscoverEdges method
message ReferrerServiceDiscoverEdgesRequest {
  // The referrers to find connections between. A digest alone does not identify a referrer, so
  // the kind travels with it.
  //
  // This is a set. A referrer may be listed more than once — a client that collected referrers
  // from several attestations will have repeats — and is then reported at the position it first
  // appeared in. At least two distinct referrers are required.
  repeated ReferrerRef nodes = 1 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 1000
  }];
  // Restricts the answer to a project, the same way DiscoverPrivate does
  string project_name = 2;
  // Only meaningful alongside project_name: version names are unique within a project
  string project_version = 3;

  option (buf.validate.message).cel = {
    id: "discover_edges_project_version_requires_project_name"
    expression: "!(this.project_version != '' && this.project_name == '')"
    message: "project_name must be set when project_version is set"
  };

  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "ReferrerServiceDiscoverEdgesRequest"
      description: "Request to discover the edges between a set of referrers"
    }
  };
}

// ReferrerServiceDiscoverEdgesResponse is the response for the DiscoverEdges method
message ReferrerServiceDiscoverEdgesResponse {
  // Each connection once, regardless of the direction it is stored in, and referred to by the
  // first position its referrers were listed under in the request
  repeated ReferrerEdge edges = 1;

  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "ReferrerServiceDiscoverEdgesResponse"
      description: "Response for the DiscoverEdges method"
    }
  };
}

// ReferrerRef identifies a referrer
message ReferrerRef {
  // Digest of the referrer, i.e sha256:deadbeef or sha1:beefdead
  string digest = 1 [(buf.validate.field).string = {min_len: 1}];
  // Kind of referrer, i.e CONTAINER_IMAGE, GIT_HEAD_COMMIT, ...
  string kind = 2 [(buf.validate.field).string = {min_len: 1}];

  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "ReferrerRef"
      description: "A reference to a referrer by digest and kind"
    }
  };
}

// ReferrerEdge is a connection between two of the requested referrers, given as indexes into the
// request's nodes so the digests do not travel back
message ReferrerEdge {
  // Index of the lower end of the connection, always smaller than to
  uint32 from = 1;
  // Index of the higher end of the connection
  uint32 to = 2;

  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "ReferrerEdge"
      description: "A connection between two referrers, as indexes into the request"
    }
  };
}

// ReferrerServiceDiscoverPrivateRequest is the request for the DiscoverPrivate method
message ReferrerServiceDiscoverPrivateRequest {
  // Digest is the unique identifier of the referrer to discover
  string digest = 1 [(buf.validate.field).string = {min_len: 1}];
  // Kind is the optional type of referrer, i.e CONTAINER_IMAGE, GIT_HEAD, ...
  // Used to filter and resolve ambiguities
  string kind = 2;
  // Pagination options for the references list
  CursorPaginationRequest pagination = 3;
  // ProjectName optionally scopes the discovery to a project by name. Can be set on its own
  // (project-wide filter) or together with project_version (project + version filter).
  string project_name = 4;
  // ProjectVersion optionally scopes the discovery to a project version (by name, e.g. v1.2.0).
  // Requires project_name, since a version name is unique only within a project.
  string project_version = 5;

  // project_version requires project_name (a version name is unique only within a project);
  // project_name on its own is allowed.
  option (buf.validate.message).cel = {
    id: "discover_project_version_requires_project_name"
    expression: "!(this.project_version != '' && this.project_name == '')"
    message: "project_name must be set when project_version is set"
  };

  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "ReferrerServiceDiscoverPrivateRequest"
      description: "Request to discover a private referrer"
    }
  };
}

// ReferrerServiceDiscoverPrivateResponse is the response for the DiscoverPrivate method
message ReferrerServiceDiscoverPrivateResponse {
  // Result is the discovered referrer item
  ReferrerItem result = 1;
  // Pagination information for the references list
  CursorPaginationResponse pagination = 2;

  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "ReferrerServiceDiscoverPrivateResponse"
      description: "Response for the DiscoverPrivate method"
    }
  };
}

// ReferrerItem represents a referrer object in the system
message ReferrerItem {
  // Digest of the referrer, i.e sha256:deadbeef or sha1:beefdead
  string digest = 1;
  // Kind of referrer, i.e CONTAINER_IMAGE, GIT_HEAD, ...
  string kind = 2;
  // Downloadable indicates whether the referrer is downloadable or not from CAS
  bool downloadable = 3;
  reserved 6;
  reserved "public";
  // References contains the list of related referrer items
  repeated ReferrerItem references = 4;
  // CreatedAt is the timestamp when the referrer was created
  google.protobuf.Timestamp created_at = 5;
  // Metadata contains additional descriptive information about the referrer
  map<string, string> metadata = 7;
  // Annotations are key-value pairs associated with the referrer
  map<string, string> annotations = 8;

  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "ReferrerItem"
      description: "It represents a referrer object in the system"
    }
  };
}
