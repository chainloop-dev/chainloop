syntax = "proto3";

package controlplane.v1;

import "buf/validate/validate.proto";
import "controlplane/v1/response_messages.proto";

option go_package = "github.com/chainloop-dev/chainloop/app/controlplane/api/controlplane/v1;v1";

service CASCredentialsService {
  rpc Get(CASCredentialsServiceGetRequest) returns (CASCredentialsServiceGetResponse);
}

message CASCredentialsServiceGetRequest {
  Role role = 1 [(buf.validate.field).enum = {
    in: [
      1,
      2
    ]
  }];
  // digest of the artifact, used to find the backend of a download and to scope the token when scope_to_digest is set
  string digest = 2;
  // flag the minted token as internal platform traffic so the CAS skips audit
  // event emission for it. Only honored for system API tokens, rejected otherwise.
  bool source_internal = 3;
  // scope the token to the requested digest, so the CAS rejects reads or writes of any other artifact.
  // Requires a digest.
  bool scope_to_digest = 4;

  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_DOWNLOADER = 1;
    ROLE_UPLOADER = 2;
  }
}

message CASCredentialsServiceGetResponse {
  Result result = 1;

  message Result {
    string token = 2;
    CASBackendItem backend = 3;
  }
}
