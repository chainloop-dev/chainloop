# Example config file
auth:
  public_key_path: "./configs/devkeys/cas.public.pem"

server:
  # Retain the native transport while evaluating the shared HTTP endpoint.
  # checkov:skip=CKV_SECRET_6: sample config with local placeholder values, no real credentials
  legacy_grpc_listener: true
  http:
    addr: 0.0.0.0:8001
    timeout: 300s
    # Shared endpoint: HTTP/1.1, HTTP/2, and native gRPC, dispatched per
    # request; native gRPC reaches the native transport through an in-process
    # reverse proxy (spec D-020).
    # Optional TLS for both transports on port 8001. Independent of grpc.tls_config.
    # tls_config:
    #   certificate: "./configs/tls/shared.crt"
    #   private_key: "./configs/tls/shared.key"
  grpc:
    addr: 0.0.0.0:9001
    timeout: 1s
    tls_config:
      certificate: "./configs/tls/server.crt"
      private_key: "./configs/tls/server.key"
  http_metrics:
    addr: 0.0.0.0:5001

credentials_service:
  # We use the prefix to check that we can read from it on initialization
  secret_prefix: chainloop-devel
  # Remember to run vault via docker compose up
  vault:
    address: ${VAULT_ADDRESS:http://0.0.0.0:8200}
    token: ${VAULT_TOKEN:notasecret}

  # aws_secret_manager:
