# Secret scanning rules for redaction: the betterleaks default ruleset, with
# allowlists for values the generic rules match in AI coding sessions but which
# are not credentials.
#
# Every allowlist targets one or more low-precision rules and tests the found
# secret, or the rule's match. None tests the whole line: a string leaf of the
# scanned document is a single line, so a line allowlist would drop every
# finding in a whole tool result.

[extend]
useDefault = true

[[allowlists]]
description = "UUIDs are identifiers, not credentials"
targetRules = ["generic-api-key", "generic-password"]
regexes = ['''^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$''']

[[allowlists]]
description = "Content digests, such as sha256:<hex>"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''(?i)\bsha(?:1|224|256|384|512):[0-9a-f]{40,128}\b''']

[[allowlists]]
description = "SSH public key fingerprints, such as the output of git log --show-signature"
targetRules = ["generic-api-key"]
regexTarget = "match"
# OpenSSH prints a fingerprint as SHA256: and the unpadded base64 of the hash,
# which is always 43 characters. The fingerprint must end the match, so a
# longer value after SHA256:, also one that goes on after a - . or _, is still
# redacted. Only the terminator the rule itself adds to its match can follow:
# a quote, a backtick, whitespace, a semicolon, or an escaped line break.
regexes = ['''\bSHA256:[A-Za-z0-9+/]{43}(?:[\x60'"\s;]|\\[nr])?$''']

[[allowlists]]
description = "Issue tracker keys, such as the Jira key in the arguments of a Jira tool call"
targetRules = ["generic-api-key"]
# A key such as {"issueIdOrKey": "PROJ-1234"} has the shape of a keyword and a
# value, and a long project key passes the entropy threshold. A Jira project key
# has at most 10 characters by default.
regexes = ['''^[A-Z][A-Z0-9_]{1,9}-[0-9]+$''']

[[allowlists]]
description = "Code expressions, test durations and the bare key word, which are not password values"
targetRules = ["generic-password"]
# The scanned text is JSON-encoded, so a match of this rule can run on through
# an escaped line break, or through a \n written in source code, which reaches
# the scanner as \\n. The scanner cuts the secret at the first, but only after
# these regexes ran, so each one also accepts such a tail.
regexes = [
    # An expression such as t.password||n.password in minified JavaScript:
    # property accesses, and only those, joined by logical operators.
    '''^[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)+(?:(?:\|\||&&|\?\?)[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)+)+(?:\\+[nrt].*)?$''',
    # A property access such as e.password or config.db_password, alone or
    # followed by logical operators and identifiers, as in e.password||n.
    '''^[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*\.\w*(?i:passw(?:or)?d|pwd)\w*(?:(?:\|\||&&|\?\?)[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*)*(?:\\+[nrt].*)?$''',
    # A redaction placeholder the transcript shows again, in the current or
    # the legacy format.
    '''^\[(?:CHAINLOOP_TRACE_)?REDACTED(?::[^\]\s]*)?\](?:\\+[nrt].*)?$''',
    # Documentation such as (password: `password`).
    '''(?i)^(?:password|passwd|pwd)(?:\\+[nrt].*)?$''',
    # The duration of a Go test, as in "--- PASS: TestPassword: (0.01s)".
    '''^\([0-9]+(?:\.[0-9]+)?(?:ns|us|µs|ms|s|m|h)\)(?:\\+[nrt].*)?$''',
]

[[allowlists]]
description = "A variable that names a credential, such as Password: registryPassword in code"
targetRules = ["generic-password"]
regexTarget = "match"
# The default rule drops unquoted values in code files, but it reads the file
# type from a path that the scanned document does not have. Only an unquoted
# value shaped like a code identifier is kept: a camelCase or snake_case name
# that holds a credential word, or the bare word secret or token that a code
# delimiter ends, as in "user, password = secret, secret". A quoted value, and a
# plain word such as supersecret in a config file or a command line, are still
# redacted. "key" is not a credential word here, because passwords such as
# "monkey" hold it.
regexes = [
    # camelCase with the credential word inside: registryPassword, githubToken.
    '''^(?i:passw(?:or)?d|psw|[_.-]pw)\b[ \t]{0,3}(?:=>|:=|=|:)[ \t]{0,5}[a-z][A-Za-z0-9]*(?:Passw|Pwd|Secret|Token|Cred)[A-Za-z0-9]*(?:\\+[nrt].*|[ \t]*[,;)}\]]?|[ \t]+(?:#|//|/\*|--).*)$''',
    # camelCase that starts with the credential word: secretValue, tokenFile.
    '''^(?i:passw(?:or)?d|psw|[_.-]pw)\b[ \t]{0,3}(?:=>|:=|=|:)[ \t]{0,5}(?:passw|pwd|secret|token|cred)[a-z0-9]*[A-Z][A-Za-z0-9]*(?:\\+[nrt].*|[ \t]*[,;)}\]]?|[ \t]+(?:#|//|/\*|--).*)$''',
    # snake_case with the credential word as one part: db_password, client_secret.
    '''^(?i:passw(?:or)?d|psw|[_.-]pw)\b[ \t]{0,3}(?:=>|:=|=|:)[ \t]{0,5}[a-z0-9_]*(?:_(?:passw|pwd|secret|token|cred)|(?:passw|pwd|secret|token|cred)[a-z0-9]*_)[a-z0-9_]*(?:\\+[nrt].*|[ \t]*[,;)}\]]?|[ \t]+(?:#|//|/\*|--).*)$''',
    # The bare word secret or token, ended by a code delimiter.
    '''^(?i:passw(?:or)?d|psw|[_.-]pw)\b[ \t]{0,3}(?:=>|:=|=|:)[ \t]{0,5}(?:secret|token)[ \t]*[,;)}\]]$''',
]

[[allowlists]]
description = "Exact password-field CSS selectors used by login helpers"
targetRules = ["generic-password"]
# Match only these complete selectors. Redactor JSON-encodes text before
# scanning, so plain quotes arrive with one backslash and JSON-encoded tool
# results with three. Keep those forms explicit and paired; do not accept
# arbitrary escaping or the whole line, which can carry other passwords.
regexes = [
    '''^(?:\[id="1-password"\]|input\[name="password"\])$''',
    '''^(?:\[id=\\"1-password\\"\]|input\[name=\\"password\\"\])$''',
    '''^(?:\[id=\\{3}"1-password\\{3}"\]|input\[name=\\{3}"password\\{3}"\])$''',
]

[[allowlists]]
description = "Placeholders in documentation, such as Bearer YOUR_API_TOKEN"
targetRules = ["curl-auth-header"]
regexes = ['''^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+$''']

[[allowlists]]
description = "A host and port read as the user and password of a URI, such as http://localhost:8000@example.com"
targetRules = ["generic-credential-uri"]
regexTarget = "match"
# The "user" must be localhost, an IPv4 address or a dotted host name, so a
# numeric password next to a plain user name, as in admin:12345@, is still
# redacted.
regexes = ['''(?i)://(?:localhost|[0-9]{1,3}(?:\.[0-9]{1,3}){3}|[a-z0-9-]+(?:\.[a-z0-9-]+)+):[0-9]{1,5}@''']

[[allowlists]]
description = "A port followed by a line break read as the password of a URI, such as a port followed by more lines up to an email address"
targetRules = ["generic-credential-uri"]
# The password stops at whitespace in source text, but in the JSON-encoded text
# a line break is the escape \n, so the match runs on into later lines up to
# the next @. Only a password that is a port, and then a line break, is kept: a
# real password followed by a line break is still redacted. A real URI on a
# later line has its own ://, which the password cannot run through, so it is
# still found. Only an escape counts: an odd run of backslashes before the n, r
# or t. A \n written in source code reaches the scanner as \\n and is not a
# line break.
regexes = ['''^[0-9]{1,5}(?:\\\\)*\\[nrt]''']

[[allowlists]]
description = "An elided password in documentation, such as http://user:…@example.com"
targetRules = ["generic-credential-uri"]
regexes = ['''^(?:…|\.{3})$''']
