# Docker Sandboxes declarative environment — EXPERIMENTAL (sbx v0.55.0+).
#
# Launches Claude Code in a Docker Sandbox with Chainloop trace already wired
# in, working on a private in-container clone of this repo.
#
#   sbx secret set chainloop                            # once: org-scoped API token
#   sbx env plan                                        # show what it would do
#   sbx env run
#   sbx env rm                                          # tear down + drop scoped creds
#
# This repo is ALREADY initialized for `chainloop trace` (.chainloop.yml with
# projectName + the `chainloop trace hook` entries in .claude/settings.json), so
# the kit runs in PERSISTENT mode: the session is recorded locally and the
# attestation is pushed by the managed pre-push hook on `git push`. Identity
# (org=chainloop, project=chainloop) comes from .chainloop.yml, NOT from here.
# No push => no attestation. Push from inside the sandbox before it is reclaimed.
#
# The file must be named `sbxenv.yaml`: sbx ignores `.sbxenv.yaml` silently. Do
# not put anything in `~/.sbxenv.yaml` either: it is read on every `sbx env`
# call, and in a directory with no project file it fails with `agent is
# required`, breaking unrelated commands like `sbx env rm`.

schemaVersion: "1"
name: chainloop-traced-claude

args:
  kitPath:
    default: ./devel/sandbox-kit/sbx-kit-claude
    description: >-
      Path to the chainloop-trace-claude kit. Deliberately the IN-REPO copy and not
      the published artifact, so this environment always runs the kit as it exists
      on the current branch: no allowlist entry, no registry round trip, and a spec
      edit takes effect without a release. Released copies go to
      docker.io/chainloop/sbx-kit-claude:<version> via
      .github/workflows/package_sandbox_kit.yaml, tagged with the `version:` in the
      kit's own spec.yaml — pass
      --env-arg kitPath=docker.io/chainloop/sbx-kit-claude:vX.Y.Z to pin one.

# Docker's built-in agent; the Chainloop kit is a mixin on top of it.
agent: claude
kits:
  # There is no mode, identity or credential argument: the kit runs persistent
  # tracing only, reads org/project/workflow from this repo's own committed
  # .chainloop.yml, and takes the token from the host's `chainloop` secret. It
  # refuses to start on a repo that has not had `chainloop trace init` run.
  - source: ${{ env.args.kitPath }}

  # Sign commits and tags with the SSH key forwarded from your host's agent, so
  # the agent's commits carry your signature and not just your name. A `kind:
  # mixin` kit, so it stacks on the kits above rather than competing with them;
  # it writes only to git's system config and resolves the key at signing time
  # from $SSH_AUTH_SOCK, so nothing private enters the VM.
  # Prerequisite: the key must be loaded on the HOST (`ssh-add ~/.ssh/id_ed25519`);
  # with no key in the agent, signing fails and so does every commit.
  # Upstream: https://github.com/docker/sbx-kits-contrib/tree/main/git-ssh-sign
  - source: docker.io/sbx/git-ssh-sign:latest

workspace:
  path: .
  # An in-container clone (host repo mounted read-only), reachable from the host
  # as the `sandbox-<name>` git remote. Required for per-file AI-vs-human line
  # attribution, which needs a readable .git and at least one commit.
  clone: false

# NOTE — deliberately NOT declared here:
#   env:      nothing to set. The token is the host's `chainloop` secret, which
#             the sbx egress proxy adds to requests; it never enters the sandbox.
#   secrets:  the `chainloop` and `anthropic` keys are already global sbx service
#             secrets (`sbx secret ls`). Declaring them again would scope a second
#             copy to this environment.
